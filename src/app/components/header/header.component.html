<header class="mh-header">
  <section class="mh-announcement" aria-label="Store announcements">
    <div class="mh-announcement__viewport">
      <div class="mh-announcement__track" [class.is-paused]="announcementsPaused">
        <div class="mh-announcement__group">
          <span *ngFor="let message of announcements">{{ message }}</span>
        </div>
        <div class="mh-announcement__group" aria-hidden="true">
          <span *ngFor="let message of announcements">{{ message }}</span>
        </div>
      </div>
    </div>
    <button class="mh-announcement__toggle" type="button"
      (click)="announcementsPaused = !announcementsPaused"
      [attr.aria-label]="announcementsPaused ? 'Play announcements' : 'Pause announcements'"
      [attr.aria-pressed]="announcementsPaused">
      <svg *ngIf="!announcementsPaused" viewBox="0 0 16 16" aria-hidden="true"><path d="M5 4v8M11 4v8" fill="none" stroke="currentColor" stroke-width="2" /></svg>
      <svg *ngIf="announcementsPaused" viewBox="0 0 16 16" aria-hidden="true"><path d="m5 3 8 5-8 5z" fill="currentColor" /></svg>
    </button>
  </section>
  <div class="mh-container mh-header__inner">
    <a data-meta-action="closeMenu" class="mh-logo" routerLink="/" (click)="closeMenu()">
      <img src="https://pub-72df2dffccc643c59aebafe55e835d7b.r2.dev/Logo/MONK_HAGEN_20260825_114655_0000_upscaled.png" alt="Monk Hagen" class="mh-logo__img" />
    </a>

    <button data-meta-action="closeMenu" *ngIf="menuOpen" class="mh-nav-backdrop" type="button" (click)="closeMenu(true)" aria-label="Close menu"></button>

    <nav #menuPanel id="customer-navigation" class="mh-nav" [class.open]="menuOpen" aria-label="Main navigation">
      <a data-meta-action="closeMenu" routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" (click)="closeMenu()">Home</a>
      <a data-meta-action="closeMenu" routerLink="/products" routerLinkActive="active" (click)="closeMenu()">Products</a>
      <a data-meta-action="closeMenu" routerLink="/about" routerLinkActive="active" (click)="closeMenu()">About Us</a>

      <ng-container *ngIf="isAdmin">
        <a data-meta-action="closeMenu" routerLink="/dashboard" routerLinkActive="active" (click)="closeMenu()">Dashboard</a>
        <a data-meta-action="closeMenu" routerLink="/admin" routerLinkActive="active" (click)="closeMenu()">Admin</a>
      </ng-container>

      <div class="mh-nav__mobileonly">
        <ng-container *ngIf="user$ | async as user; else mobileLogin">
          <span class="mh-nav__hi">Hi, {{ user.name }}</span>
          <a data-meta-action="closeMenu" routerLink="/account/profile" (click)="closeMenu()">Profile</a>
          <a data-meta-action="closeMenu" routerLink="/account/addresses" (click)="closeMenu()">Addresses</a>
          <a data-meta-action="closeMenu" routerLink="/account/orders" (click)="closeMenu()">My Orders</a>
          <a data-meta-action="closeMenu" routerLink="/account/returns" (click)="closeMenu()">Returns/Replacement</a>
          <button data-meta-action="logout" type="button" class="mh-nav__logout" (click)="logout()">Logout</button>
        </ng-container>
        <ng-template #mobileLogin>
          <a data-meta-action="closeMenu" routerLink="/login" (click)="closeMenu()">Login</a>
        </ng-template>
      </div>
    </nav>

    <div class="mh-header__actions">
      <ng-container *ngIf="user$ | async as user; else loginLink">
        <div class="mh-user">
          <div class="mh-user__profile">
            <a data-meta-action="dismissProfileHint" class="mh-user__name"
               [class.mh-user__name--highlight]="showProfileHint"
               routerLink="/account/profile"
               (click)="dismissProfileHint()">{{ user.name }}</a>
            <a data-meta-action="dismissProfileHint" class="mh-user__hint"
               *ngIf="showProfileHint"
               routerLink="/account/profile"
               (click)="dismissProfileHint()">You can edit profile here</a>
          </div>
          <button data-meta-action="logout" class="mh-linkbtn" (click)="logout()">Logout</button>
        </div>
      </ng-container>
      <ng-template #loginLink>
        <a class="mh-icon-link" routerLink="/login" aria-label="Login or create an account">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4.5 21a7.5 7.5 0 0 1 15 0"/></svg>
          <span>Login</span>
        </a>
      </ng-template>

      <a *ngIf="user$ | async" class="mh-account-icon" routerLink="/account/profile" aria-label="My account">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4.5 21a7.5 7.5 0 0 1 15 0"/></svg>
      </a>

      <a class="mh-cart" routerLink="/cart" aria-label="Cart">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
          <path d="M6 7h12l-1 13H7L6 7z" />
          <path d="M9 7a3 3 0 0 1 6 0" />
        </svg>
        <span class="mh-cart__badge" *ngIf="cart.count > 0">{{ cart.count > 99 ? '99+' : cart.count }}</span>
      </a>

      <button data-meta-action="toggleMenu" #menuButton class="mh-burger" (click)="toggleMenu()"
        [attr.aria-label]="menuOpen ? 'Close menu' : 'Open menu'"
        [attr.aria-expanded]="menuOpen" aria-controls="customer-navigation">
        <span></span><span></span><span></span>
      </button>
    </div>
  </div>
</header>
