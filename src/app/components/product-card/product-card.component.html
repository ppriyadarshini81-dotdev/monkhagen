<a data-meta-action="rememberPosition"
  class="mh-pcard"
  [routerLink]="['/product', product.slug]"
  [attr.data-scroll-product-id]="product.id"
  (click)="rememberPosition($event)"
  (mouseenter)="onMouseEnter()"
  (mouseleave)="onMouseLeave()"
>
  <div class="mh-pcard__media"
       (touchstart)="onImageTouchStart($event)"
       (touchend)="onImageTouchEnd($event)">
    <div class="mh-pcard__image-track"
         [class.mh-pcard__image-track--instant]="!imageAnimating"
         [style.transform]="'translate3d(-' + currentImageIndex * 100 + '%, 0, 0)'"
         (transitionend)="onImageTransitionEnd($event)">
      <img *ngFor="let image of imageSlides; let i = index"
           [attr.src]="i === 0 || imagesActivated ? image : null"
           [alt]="i === 0 ? product.name : ''"
           [attr.aria-hidden]="i !== currentImageIndex"
           loading="lazy"
           decoding="async"
           (load)="onImageLoaded(i)" />
    </div>
    <div class="mh-pcard__image-dots" *ngIf="cycleImages && product.images.length > 1" aria-hidden="true">
      <span *ngFor="let image of product.images; let i = index" [class.active]="i === visibleImageIndex"></span>
    </div>
    <span class="mh-pcard__badge" *ngIf="product.badge">{{ product.badge }}</span>

    <button data-meta-action="quickAdd"
      class="mh-pcard__add"
      type="button"
      *ngIf="!showSizePicker"
      [disabled]="loadingSizes"
      (click)="quickAdd($event)"
    >
      {{ loadingSizes ? 'Loading sizes...' : (added ? 'Added ✓' : 'Quick Add') }}
    </button>

    <div
      class="mh-pcard__sizes"
      *ngIf="showSizePicker"
      (click)="$event.preventDefault(); $event.stopPropagation()"
    >
      <span>Choose a size</span>
      <div class="mh-pcard__size-list">
        <button data-meta-action="selectSize"
          type="button"
          *ngFor="let size of availableSizes"
          [disabled]="adding"
          (click)="selectSize($event, size)"
        >{{ size }}</button>
      </div>
      <small *ngIf="addError">{{ addError }}</small>
    </div>
  </div>

  <div class="mh-pcard__body">
    <span class="mh-pcard__cat">{{ product.category }}</span>
    <h3 class="mh-pcard__name">{{ product.name }}</h3>
    <div class="mh-pcard__foot">
      <span class="mh-pcard__price">₹{{ product.price | number }}</span>
      <span class="mh-pcard__rating">★ {{ product.rating || '—' }}</span>
    </div>
  </div>
</a>
