<section class="admin-portal">
  <nav class="admin-portal__nav" aria-label="Admin portal">
    <div class="admin-portal__brand"><span class="admin-portal__brand-icon" aria-hidden="true">&#9638;</span><strong>Monk Hagen Admin</strong></div>
    <div class="admin-portal__primary">
      <a routerLink="dashboard" routerLinkActive="active"><span aria-hidden="true">&#9638;</span>Dashboard</a><a routerLink="ledger" routerLinkActive="active"><span aria-hidden="true">&#9783;</span>Ledger</a><a routerLink="stock" routerLinkActive="active"><span aria-hidden="true">&#9671;</span>Stock</a><a routerLink="orders" routerLinkActive="active"><span aria-hidden="true">&#9634;</span>Orders</a><a routerLink="returns" routerLinkActive="active"><span aria-hidden="true">&#8635;</span>Returns &amp; Replacements</a><a routerLink="products" routerLinkActive="active"><span aria-hidden="true">&#9838;</span>Products</a><a routerLink="reviews" routerLinkActive="active"><span aria-hidden="true">&#9734;</span>Reviews</a>
