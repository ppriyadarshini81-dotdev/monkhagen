<section class="mh-email mh-container">

  <div class="mh-email__layout">
    <header class="mh-email__head">
      <span class="mh-eyebrow">Customer support</span>
      <h1>Email Us</h1>
      <p>Tell us how we can help. Your message will be sent directly to the Monk Hagen team.</p>
      <span class="mh-email__subject">Subject: Query from customer</span>
    </header>

    <form class="mh-email__form mh-card" #contactForm="ngForm" (ngSubmit)="submit()">
      <div class="mh-field">
        <label class="mh-label" for="contact-name">Name *</label>
        <input
          class="mh-input"
          id="contact-name"
          name="name"
          type="text"
          maxlength="120"
          autocomplete="name"
          [(ngModel)]="form.name"
          required
          [attr.aria-invalid]="submitted && !validName"
        />
        <p class="mh-contact-field-error" *ngIf="submitted && !validName">Enter your name.</p>
      </div>

      <div class="mh-field">
        <label class="mh-label" for="contact-email">Email *</label>
        <input
          class="mh-input"
          id="contact-email"
          name="email"
          type="email"
          maxlength="254"
          autocomplete="email"
          [(ngModel)]="form.email"
          required
          email
          [attr.aria-invalid]="submitted && !validEmail"
        />
        <p class="mh-contact-field-error" *ngIf="submitted && !validEmail">Enter a valid email address.</p>
      </div>

      <div class="mh-field">
        <label class="mh-label" for="contact-query">Your query *</label>
        <textarea
          class="mh-textarea"
          id="contact-query"
          name="query"
          rows="8"
          minlength="10"
          maxlength="5000"
          placeholder="Type your question here..."
          [(ngModel)]="form.query"
          required
          [attr.aria-invalid]="submitted && !validQuery"
        ></textarea>
        <span class="mh-email__count">{{ form.query.length }} / 5,000</span>
        <p class="mh-contact-field-error" *ngIf="submitted && !validQuery">Enter at least 10 meaningful characters.</p>
      </div>

      <p class="mh-success" role="status" *ngIf="success">{{ success }}</p>
      <p class="mh-error" role="alert" *ngIf="error">{{ error }}</p>

      <button class="mh-btn mh-btn--gold" type="submit" [disabled]="sending">
        {{ sending ? 'Sendingâ€¦' : 'Send query' }}
      </button>
    </form>
  </div>
</section>
