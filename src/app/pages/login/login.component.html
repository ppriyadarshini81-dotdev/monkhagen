<section class="mh-auth">
  <div class="mh-auth__card mh-card">
    <a class="mh-logo" routerLink="/" aria-label="Monk Hagen home">MONK<span>HAGEN</span></a>
    <h1>Welcome back</h1>
    <p class="mh-auth__sub">Sign in to continue to Monk Hagen.</p>

    <div class="mh-auth__tabs">
      <button type="button" [class.active]="tab === 'google'" (click)="switchTab('google')">Customer</button>
      <button type="button" [class.active]="tab === 'email'" (click)="switchTab('email')">Admin</button>
    </div>

    <ng-container *ngIf="tab === 'google'">
      <p class="mh-auth__sub">Sign in with your Google account to shop.</p>
      <p class="mh-error" *ngIf="error">{{ error }}</p>

      <button class="mh-btn mh-btn--google mh-btn--block"
              type="button"
              [disabled]="loading"
              (click)="continueWithGoogle()">
        <svg width="18" height="18" viewBox="0 0 48 48" *ngIf="!loading" aria-hidden="true">
          <path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9 3.2l6.7-6.7C35.7 2.4 30.2 0 24 0 14.7 0 6.8 5.4 3 13.3l7.8 6.1C12.5 13.1 17.8 9.5 24 9.5z"/>
          <path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v8.5h12.7c-.6 3-2.3 5.5-4.8 7.2l7.5 5.8c4.4-4.1 7.1-10.1 7.1-17z"/>
          <path fill="#FBBC05" d="M10.8 28.6A14.5 14.5 0 0 1 9.5 24c0-1.6.3-3.2.8-4.6L2.5 13.3A23.9 23.9 0 0 0 0 24c0 3.8.9 7.4 2.5 10.7l8.3-6.1z"/>
          <path fill="#34A853" d="M24 48c6.2 0 11.4-2 15.2-5.5l-7.5-5.8c-2 1.4-4.6 2.3-7.7 2.3-6.2 0-11.5-4.2-13.2-9.9l-8.3 6c3.8 7.6 11.6 12.9 21.5 12.9z"/>
        </svg>
        {{ loading ? 'Signing in…' : 'Continue with Google' }}
      </button>
    </ng-container>

    <ng-container *ngIf="tab === 'email'">
      <form (ngSubmit)="submit()">
        <div class="mh-field">
          <label class="mh-label" for="admin-email">Email</label>
          <input class="mh-input" id="admin-email" name="email" type="email" [(ngModel)]="email"
                 required autocomplete="username" placeholder="admin@example.com" />
        </div>
        <div class="mh-field">
          <label class="mh-label" for="admin-password">Password</label>
          <input class="mh-input" id="admin-password" name="password" type="password" [(ngModel)]="password"
                 required autocomplete="current-password" placeholder="••••••••" />
        </div>
        <p class="mh-error" *ngIf="error">{{ error }}</p>
        <button class="mh-btn mh-btn--gold mh-btn--block" type="submit" [disabled]="loading">
          {{ loading ? 'Please wait…' : 'Sign In' }}
        </button>
      </form>

      <div class="mh-auth__demo">
        <span>Demo:</span>
        <button type="button" (click)="fillDemo()">Admin account</button>
      </div>
    </ng-container>
  </div>
</section>
