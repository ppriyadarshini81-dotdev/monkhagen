<section class="mh-products mh-container">
  <header class="mh-products__head">
    <span class="mh-eyebrow">Shop All</span>
    <h1>Products</h1>
    <p>Every piece, limited and heavyweight. Built to last.</p>
  </header>

  <!-- Category image blocks -->
  <div class="mh-catblocks" *ngIf="categories.length">
    <button
      class="mh-catblock"
      [class.active]="activeCategory === 'All'"
      (click)="setCategory('All')"
    >
      <div class="mh-catblock__img mh-catblock__img--all"><span>★</span></div>
      <span class="mh-catblock__name">All</span>
    </button>

    <button
      *ngFor="let cat of categories"
      class="mh-catblock"
      [class.active]="activeCategory === cat.name"
      (click)="setCategory(cat.name)"
    >
      <div class="mh-catblock__img">
        <img [src]="cat.image" [alt]="cat.name" loading="lazy" />
      </div>
      <span class="mh-catblock__name">{{ cat.name }}</span>
      <span class="mh-catblock__count" *ngIf="cat.productCount != null">
        {{ cat.productCount }}
      </span>
    </button>
  </div>

  <div class="mh-toolbar">
    <div class="mh-chips">
      <button
        *ngFor="let cat of categoryNames"
        class="mh-chip"
        [class.active]="activeCategory === cat"
        (click)="setCategory(cat)"
      >
        {{ cat }}
      </button>
    </div>

    <div class="mh-toolbar__right">
      <input
        class="mh-input mh-search"
        type="text"
        placeholder="Search products…"
        [(ngModel)]="search"
        (keyup.enter)="load()"
      />
      <select class="mh-select mh-sort" [(ngModel)]="sort" (change)="onSortChange()">
        <option value="featured">Featured</option>
        <option value="price-asc">Price: Low to High</option>
        <option value="price-desc">Price: High to Low</option>
        <option value="rating">Top Rated</option>
      </select>
    </div>
  </div>

  <div class="mh-grid" *ngIf="!loading; else loadingTpl">
    <app-product-card *ngFor="let p of products" [product]="p"></app-product-card>
  </div>

  <p class="mh-empty" *ngIf="!loading && products.length === 0">
    No products match your search.
  </p>

  <ng-template #loadingTpl>
    <div class="mh-grid">
      <div class="mh-skeleton" *ngFor="let n of [1,2,3,4,5,6]"></div>
    </div>
  </ng-template>
</section>
